name: Build release binaries

# Builds standalone nextpnr binaries for Windows, Linux and macOS (x86_64 +
# arm64).
#
# Strategy: the per-architecture chip databases are compiled from their source
# projects (IceStorm, Trellis, prjoxide, ...) into portable `.bba` files *once*
# on Linux (`chipdb` job). Every platform then builds nextpnr with
# `-DIMPORT_BBA_FILES`, so Windows/macOS need none of those database tools.
#
# Binaries are installed into a bin/ + share/ layout so that architectures whose
# chip database is loaded at runtime (Himbächel) find their data next to the
# executable.
#
# Run manually via "Run workflow", or push a tag like `v0.1` to also publish a
# GitHub Release with the archives attached.

on:
  push:
    tags:
      - 'v*'
    # TEMPORARY: validate the expanded arch set on the feature branch.
    # Remove before merging to main.
    branches:
      - ci/all-arches
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the same revisions as the arch CI, for reproducible chipdbs.
  ICESTORM_REVISION: 68044cc4dac829729ccd0ee88d0780525b515746
  TRELLIS_REVISION: 36c615d1740473cc3574464c7f0bed44da20e5b6
  PRJOXIDE_REVISION: c3fb1526cf4a2165e15b74f4a994d153c7695fe4
  # Architectures whose chip database can be pre-generated as .bba and imported
  # on every platform.
  ARCHES: "ice40;ecp5;generic;nexus;machxo2;himbaechel"
  # Himbächel microarchitectures and the devices to include for each. These must
  # be identical in the chipdb (generate) and build (import) jobs.
  HIMBAECHEL_UARCH: "gowin;gatemate"
  HIMBAECHEL_GOWIN_DEVICES: "GW1N-9C;GW5A-25A"
  HIMBAECHEL_GATEMATE_DEVICES: "CCGM1A1;CCGM1A2"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Generate portable chip databases (.bba) on Linux.
  # ---------------------------------------------------------------------------
  chipdb:
    name: Generate chipdbs
    runs-on: ubuntu-22.04
    env:
      DEPS_PATH: ${{ github.workspace }}/deps
    steps:
      - uses: actions/checkout@v4

      # The generated chipdbs only depend on the arch list and the pinned
      # database-tool revisions, so cache the whole set. On a hit we skip
      # building the database tools and regenerating entirely.
      - name: Cache generated chipdbs
        uses: actions/cache@v4
        id: cache-chipdbs
        with:
          path: chipdbs
          key: chipdbs-all-hb-gowin-gatemate-ice${{ env.ICESTORM_REVISION }}-tr${{ env.TRELLIS_REVISION }}-ox${{ env.PRJOXIDE_REVISION }}-v3

      # NOTE: deliberately NOT using actions/setup-python here. Trellis builds a
      # compiled `pytrellis` module against the system Python; the ecp5/machxo2
      # chipdb generators import it, so the interpreter that CMake picks must be
      # the exact same system Python. A mismatched setup-python would break
      # `import pytrellis` at generation time.
      - name: Install build dependencies
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          # libftdi-dev is needed by IceStorm's iceprog tool (built as part of
          # `make`); the rest is for building the database tools and chipdbs.
          sudo apt-get install -y --no-install-recommends \
            git make cmake g++ libboost-all-dev libeigen3-dev \
            python3 python3-dev python3-pip zlib1g-dev libftdi-dev

      - name: Cache IceStorm
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: cache-icestorm
        with:
          path: .icestorm
          key: release-icestorm-${{ env.ICESTORM_REVISION }}

      - name: Build IceStorm
        if: steps.cache-chipdbs.outputs.cache-hit != 'true' && steps.cache-icestorm.outputs.cache-hit != 'true'
        run: |
          source ./.github/ci/build_common.sh
          build_icestorm

      - name: Cache Trellis
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: cache-trellis
        with:
          path: .trellis
          key: release-trellis-${{ env.TRELLIS_REVISION }}

      - name: Build Trellis
        if: steps.cache-chipdbs.outputs.cache-hit != 'true' && steps.cache-trellis.outputs.cache-hit != 'true'
        run: |
          source ./.github/ci/build_common.sh
          build_trellis

      - name: Cache prjoxide
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: cache-prjoxide
        with:
          path: .prjoxide
          key: release-prjoxide-${{ env.PRJOXIDE_REVISION }}

      - name: Build prjoxide
        if: steps.cache-chipdbs.outputs.cache-hit != 'true' && steps.cache-prjoxide.outputs.cache-hit != 'true'
        run: |
          source ./.github/ci/build_common.sh
          build_prjoxide

      # Himbächel database sources. apycula (gowin) is a Python package imported
      # by the gowin chipdb generator; Peppercorn (gatemate) is a git checkout.
      - name: Fetch Himbächel database sources
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        run: |
          pip3 install apycula
          git clone https://github.com/YosysHQ/prjpeppercorn "${GITHUB_WORKSPACE}/deps/prjpeppercorn"

      - name: Generate .bba chip databases
        if: steps.cache-chipdbs.outputs.cache-hit != 'true'
        run: |
          # NB: use a dedicated directory name (not "bba", which already exists
          # in the source tree as the bbasm tool) to avoid a path collision.
          mkdir -p "${GITHUB_WORKSPACE}"/chipdbs/{ice40,ecp5,nexus,machxo2}
          mkdir -p "${GITHUB_WORKSPACE}"/chipdbs/himbaechel/uarch/{gowin,gatemate}
          cmake -B build-bba \
            -DARCH="${ARCHES}" \
            -DBUILD_PYTHON=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DICESTORM_INSTALL_PREFIX="${GITHUB_WORKSPACE}/.icestorm" \
            -DTRELLIS_INSTALL_PREFIX="${GITHUB_WORKSPACE}/.trellis" \
            -DOXIDE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/.prjoxide" \
            -DHIMBAECHEL_UARCH="${HIMBAECHEL_UARCH}" \
            -DHIMBAECHEL_GOWIN_DEVICES="${HIMBAECHEL_GOWIN_DEVICES}" \
            -DHIMBAECHEL_GATEMATE_DEVICES="${HIMBAECHEL_GATEMATE_DEVICES}" \
            -DHIMBAECHEL_PEPPERCORN_PATH="${GITHUB_WORKSPACE}/deps/prjpeppercorn" \
            -DEXPORT_BBA_FILES="${GITHUB_WORKSPACE}/chipdbs"
          cmake --build build-bba --target nextpnr-all-bba -j"$(nproc)"

      - name: Show generated chipdbs
        run: find chipdbs -type f | sort

      - name: Upload chipdbs
        uses: actions/upload-artifact@v4
        with:
          name: chipdb-bba
          path: chipdbs/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 2. Build the release binaries on every platform.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: chipdb
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14
          - name: windows-x86_64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download chipdbs
        uses: actions/download-artifact@v4
        with:
          name: chipdb-bba
          path: chipdbs

      # --- Dependencies -----------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # bz2/lzma dev packages provide the static archives that the static
          # Boost.Iostreams library pulls in when fully static-linking.
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libboost-all-dev libeigen3-dev \
            zlib1g-dev libbz2-dev liblzma-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # zstd, xz (liblzma) and icu4c are pulled in transitively by Homebrew's
        # static Boost at link time; install them explicitly so the dylibs exist.
        run: brew install boost eigen zstd xz icu4c

      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-static-boost-eigen-v1

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            boost-program-options:x64-windows-static `
            boost-iostreams:x64-windows-static `
            boost-thread:x64-windows-static `
            eigen3:x64-windows-static

      # --- Configure --------------------------------------------------------
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH="${ARCHES}" \
            -DBUILD_PYTHON=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DSTATIC_BUILD=ON \
            -DUSE_IPO=OFF \
            -DHIMBAECHEL_UARCH="${HIMBAECHEL_UARCH}" \
            -DHIMBAECHEL_GOWIN_DEVICES="${HIMBAECHEL_GOWIN_DEVICES}" \
            -DHIMBAECHEL_GATEMATE_DEVICES="${HIMBAECHEL_GATEMATE_DEVICES}" \
            -DIMPORT_BBA_FILES="${GITHUB_WORKSPACE}/chipdbs"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          # Homebrew's static Boost references compression/ICU libraries via bare
          # -l flags with no path. Some of those (e.g. icu4c) are keg-only and
          # live under opt/<pkg>/lib, so add every Homebrew keg lib dir to the
          # linker search path rather than chasing them one by one.
          LDIRS="-L$(brew --prefix)/lib"
          for d in "$(brew --prefix)"/opt/*/lib; do
            [ -d "$d" ] && LDIRS="$LDIRS -L$d"
          done
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH="${ARCHES}" \
            -DBUILD_PYTHON=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DSTATIC_BUILD=ON \
            -DUSE_IPO=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="$LDIRS" \
            -DHIMBAECHEL_UARCH="${HIMBAECHEL_UARCH}" \
            -DHIMBAECHEL_GOWIN_DEVICES="${HIMBAECHEL_GOWIN_DEVICES}" \
            -DHIMBAECHEL_GATEMATE_DEVICES="${HIMBAECHEL_GATEMATE_DEVICES}" \
            -DIMPORT_BBA_FILES="${GITHUB_WORKSPACE}/chipdbs"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Don't use the project's STATIC_BUILD (its /MT flag munging predates
        # CMP0091 and only reaches some targets, so bbasm links with /MD and
        # clashes with static-CRT Boost). Instead drive the CRT the modern way:
        # x64-windows-static (static Boost) + MultiThreaded runtime for all
        # targets. Result is a fully static, dependency-free .exe.
        run: |
          cmake -B build \
            -DARCH="${ARCHES}" \
            -DBUILD_PYTHON=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DUSE_IPO=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DHIMBAECHEL_UARCH="${HIMBAECHEL_UARCH}" \
            -DHIMBAECHEL_GOWIN_DEVICES="${HIMBAECHEL_GOWIN_DEVICES}" \
            -DHIMBAECHEL_GATEMATE_DEVICES="${HIMBAECHEL_GATEMATE_DEVICES}" \
            -DIMPORT_BBA_FILES="${GITHUB_WORKSPACE}/chipdbs" \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      # --- Build & install --------------------------------------------------
      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Install into staging tree
        # Installs binaries to <stage>/bin and any runtime chip databases to
        # <stage>/share/nextpnr, which is the layout the binaries expect.
        run: cmake --install build --config Release --prefix "${GITHUB_WORKSPACE}/nextpnr-${{ matrix.name }}"

      - name: Strip binaries (Unix)
        if: runner.os != 'Windows'
        run: strip "${GITHUB_WORKSPACE}/nextpnr-${{ matrix.name }}"/bin/nextpnr-*

      # --- Package ----------------------------------------------------------
      - name: Package
        run: |
          set -euo pipefail
          STAGE="nextpnr-${{ matrix.name }}"
          cp COPYING README.md "$STAGE/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -E tar cf "$STAGE.zip" --format=zip "$STAGE"
            echo "ASSET=$STAGE.zip" >> "$GITHUB_ENV"
          else
            cmake -E tar czf "$STAGE.tar.gz" "$STAGE"
            echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Smoke test binaries
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/nextpnr-${{ matrix.name }}"
          for bin in "$STAGE"/bin/nextpnr-*; do
            echo "== $bin --version =="
            "$bin" --version
          done
          # Exercise a runtime-loaded Himbächel chipdb end to end: this only
          # passes if the share/ tree was packaged correctly and the binary
          # resolves it relative to bin/. --test also verifies db integrity.
          HB="$STAGE/bin/nextpnr-himbaechel"
          [ "${{ runner.os }}" = "Windows" ] && HB="$HB.exe"
          echo "== himbaechel gatemate chipdb load =="
          "$HB" --device CCGM1A1 --test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextpnr-${{ matrix.name }}
          path: ${{ env.ASSET }}

  # ---------------------------------------------------------------------------
  # 3. Publish a GitHub Release when a tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nextpnr-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
